<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serenity - Meditation App</title>
  <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #8B5CF6;
      --primary-light: #A78BFA;
      --primary-dark: #7C3AED;
      --secondary: #10B981;
      --secondary-light: #34D399;
      --secondary-dark: #059669;
      --bg-light: #F9FAFB;
      --bg-dark: #1F2937;
      --text-light: #1F2937;
      --text-dark: #F9FAFB;
    }
    
    .theme-light {
      --bg: var(--bg-light);
      --text: var(--text-light);
      --card-bg: white;
      --card-shadow: rgba(0, 0, 0, 0.1);
    }
    
    .theme-dark {
      --bg: var(--bg-dark);
      --text: var(--text-dark);
      --card-bg: #374151;
      --card-shadow: rgba(0, 0, 0, 0.3);
    }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    .card {
      background-color: var(--card-bg);
      box-shadow: 0 4px 6px var(--card-shadow);
      transition: background-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
    }
    
    .card:hover {
      transform: translateY(-2px);
    }
    
    .btn-primary {
      background-color: var(--primary);
      transition: background-color 0.3s ease;
    }
    
    .btn-primary:hover {
      background-color: var(--primary-dark);
    }
    
    .btn-secondary {
      background-color: var(--secondary);
      transition: background-color 0.3s ease;
    }
    
    .btn-secondary:hover {
      background-color: var(--secondary-dark);
    }
    
    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .slide-in {
      animation: slideIn 0.5s ease-out;
    }
    
    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .pulse {
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Utility functions
    const formatTime = (minutes) => {
      const hrs = Math.floor(minutes / 60);
      const mins = minutes % 60;
      return `${hrs > 0 ? hrs + 'h ' : ''}${mins}m`;
    };
    
    const formatDate = (date) => {
      return new Date(date).toLocaleDateString('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });
    };
    
    // Custom hook for local storage
    const useLocalStorage = (key, initialValue) => {
      const [storedValue, setStoredValue] = React.useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) {
          console.error(error);
          return initialValue;
        }
      });
      
      const setValue = (value) => {
        try {
          const valueToStore = value instanceof Function ? value(storedValue) : value;
          setStoredValue(valueToStore);
          window.localStorage.setItem(key, JSON.stringify(valueToStore));
        } catch (error) {
          console.error(error);
        }
      };
      
      return [storedValue, setValue];
    };
    
    // Components
    const ThemeToggle = ({ darkMode, toggleDarkMode }) => {
      return (
        <button 
          onClick={toggleDarkMode}
          className="p-2 rounded-full focus:outline-none"
          aria-label={darkMode ? "Switch to light mode" : "Switch to dark mode"}
        >
          {darkMode ? (
            <i data-lucide="sun" className="w-6 h-6 text-yellow-300"></i>
          ) : (
            <i data-lucide="moon" className="w-6 h-6 text-gray-700"></i>
          )}
        </button>
      );
    };
    
    const Header = ({ darkMode, toggleDarkMode }) => {
      return (
        <header className="py-4 px-6 flex justify-between items-center">
          <div className="flex items-center">
            <i data-lucide="lotus" className="w-8 h-8 mr-2 text-purple-500"></i>
            <h1 className="text-2xl font-bold">Serenity</h1>
          </div>
          <ThemeToggle darkMode={darkMode} toggleDarkMode={toggleDarkMode} />
        </header>
      );
    };
    
    const MeditationCard = ({ meditation, onSelect, isActive }) => {
      return (
        <div 
          className={`card rounded-lg p-4 mb-4 cursor-pointer ${isActive ? 'ring-2 ring-purple-500' : ''}`}
          onClick={() => onSelect(meditation)}
        >
          <div className="flex items-center mb-2">
            <i data-lucide={meditation.icon} className="w-5 h-5 mr-2 text-purple-500"></i>
            <h3 className="font-semibold">{meditation.title}</h3>
          </div>
          <p className="text-sm opacity-75 mb-2">{meditation.description}</p>
          <div className="flex justify-between text-xs">
            <span className="flex items-center">
              <i data-lucide="clock" className="w-4 h-4 mr-1"></i>
              {formatTime(meditation.duration)}
            </span>
            <span className="flex items-center">
              <i data-lucide="tag" className="w-4 h-4 mr-1"></i>
              {meditation.category}
            </span>
          </div>
        </div>
      );
    };
    
    const YouTubePlayer = ({ videoId }) => {
      if (!videoId) return null;
      
      return (
        <div className="aspect-w-16 aspect-h-9 rounded-lg overflow-hidden shadow-lg mb-6">
          <iframe
            src={`https://www.youtube.com/embed/${videoId}?autoplay=0&rel=0`}
            title="YouTube video player"
            frameBorder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowFullScreen
            className="w-full h-full"
          ></iframe>
        </div>
      );
    };
    
    const ScheduleItem = ({ session, onDelete }) => {
      return (
        <div className="card rounded-lg p-3 mb-3 flex justify-between items-center slide-in">
          <div>
            <div className="flex items-center">
              <i data-lucide="calendar" className="w-4 h-4 mr-2 text-purple-500"></i>
              <span className="font-medium">{formatDate(session.date)}</span>
            </div>
            <div className="text-sm opacity-75 mt-1">
              {session.meditation.title} - {formatTime(session.meditation.duration)}
            </div>
          </div>
          <button 
            onClick={() => onDelete(session.id)}
            className="p-1 rounded-full hover:bg-red-100 dark:hover:bg-red-900 transition-colors"
            aria-label="Delete session"
          >
            <i data-lucide="trash-2" className="w-5 h-5 text-red-500"></i>
          </button>
        </div>
      );
    };
    
    const ProgressChart = ({ completedSessions }) => {
      // Group sessions by day of week
      const dayCount = [0, 0, 0, 0, 0, 0, 0]; // Sun-Sat
      
      completedSessions.forEach(session => {
        const date = new Date(session.date);
        const day = date.getDay();
        dayCount[day]++;
      });
      
      const maxCount = Math.max(...dayCount, 1);
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      
      return (
        <div className="card rounded-lg p-4 mb-6">
          <h3 className="font-semibold mb-4 flex items-center">
            <i data-lucide="bar-chart-2" className="w-5 h-5 mr-2 text-purple-500"></i>
            Weekly Progress
          </h3>
          <div className="flex items-end h-32 space-x-2">
            {dayCount.map((count, index) => (
              <div key={index} className="flex flex-col items-center flex-1">
                <div 
                  className="w-full bg-purple-500 rounded-t-sm transition-all duration-500 ease-out"
                  style={{ 
                    height: `${(count / maxCount) * 100}%`,
                    minHeight: count > 0 ? '4px' : '0'
                  }}
                ></div>
                <div className="text-xs mt-1">{days[index]}</div>
              </div>
            ))}
          </div>
        </div>
      );
    };
    
    const ScheduleForm = ({ meditations, onSchedule }) => {
      const [selectedMeditation, setSelectedMeditation] = React.useState(null);
      const [scheduleDate, setScheduleDate] = React.useState('');
      const [error, setError] = React.useState('');
      
      const handleSubmit = (e) => {
        e.preventDefault();
        
        if (!selectedMeditation) {
          setError('Please select a meditation');
          return;
        }
        
        if (!scheduleDate) {
          setError('Please select a date');
          return;
        }
        
        onSchedule({
          id: Date.now(),
          meditation: selectedMeditation,
          date: new Date(scheduleDate).toISOString(),
          completed: false
        });
        
        setSelectedMeditation(null);
        setScheduleDate('');
        setError('');
      };
      
      return (
        <form onSubmit={handleSubmit} className="card rounded-lg p-4 mb-6">
          <h3 className="font-semibold mb-4 flex items-center">
            <i data-lucide="calendar-plus" className="w-5 h-5 mr-2 text-purple-500"></i>
            Schedule Session
          </h3>
          
          <div className="mb-4">
            <label className="block text-sm font-medium mb-1">Meditation</label>
            <select 
              className="w-full p-2 border rounded-md bg-transparent"
              value={selectedMeditation ? selectedMeditation.id : ''}
              onChange={(e) => {
                const meditation = meditations.find(m => m.id === parseInt(e.target.value));
                setSelectedMeditation(meditation || null);
              }}
            >
              <option value="">Select a meditation</option>
              {meditations.map(meditation => (
                <option key={meditation.id} value={meditation.id}>
                  {meditation.title} ({formatTime(meditation.duration)})
                </option>
              ))}
            </select>
          </div>
          
          <div className="mb-4">
            <label className="block text-sm font-medium mb-1">Date & Time</label>
            <input 
              type="datetime-local" 
              className="w-full p-2 border rounded-md bg-transparent"
              value={scheduleDate}
              onChange={(e) => setScheduleDate(e.target.value)}
              min={new Date().toISOString().slice(0, 16)}
            />
          </div>
          
          {error && (
            <div className="text-red-500 text-sm mb-4">{error}</div>
          )}
          
          <button 
            type="submit"
            className="btn-primary text-white py-2 px-4 rounded-md w-full font-medium"
          >
            Schedule Session
          </button>
        </form>
      );
    };
    
    const App = () => {
      const [darkMode, setDarkMode] = useLocalStorage('darkMode', false);
      const [selectedMeditation, setSelectedMeditation] = React.useState(null);
      const [scheduledSessions, setScheduledSessions] = useLocalStorage('scheduledSessions', []);
      const [completedSessions, setCompletedSessions] = useLocalStorage('completedSessions', []);
      
      // Sample meditation data
      const meditations = [
        {
          id: 1,
          title: "Morning Mindfulness",
          description: "Start your day with clarity and purpose",
          duration: 10,
          category: "Mindfulness",
          icon: "sunrise",
          videoId: "O-6f5wQXSu8"
        },
        {
          id: 2,
          title: "Deep Relaxation",
          description: "Release tension and find deep calm",
          duration: 20,
          category: "Relaxation",
          icon: "cloud",
          videoId: "z6X5oEIg6Ak"
        },
        {
          id: 3,
          title: "Loving Kindness",
          description: "Cultivate compassion for yourself and others",
          duration: 15,
          category: "Compassion",
          icon: "heart",
          videoId: "sz7cpV7ERsM"
        },
        {
          id: 4,
          title: "Body Scan",
          description: "Connect with your body and release tension",
          duration: 25,
          category: "Body Awareness",
          icon: "activity",
          videoId: "QS2yDmWk0vs"
        },
        {
          id: 5,
          title: "Sleep Meditation",
          description: "Prepare your mind for restful sleep",
          duration: 30,
          category: "Sleep",
          icon: "moon",
          videoId: "aEqlQvczMJQ"
        }
      ];
      
      React.useEffect(() => {
        // Apply theme class to body
        document.body.className = darkMode ? 'theme-dark' : 'theme-light';
        
        // Initialize Lucide icons
        lucide.createIcons();
      }, [darkMode]);
      
      const toggleDarkMode = () => {
        setDarkMode(!darkMode);
      };
      
      const handleScheduleSession = (session) => {
        setScheduledSessions([...scheduledSessions, session]);
      };
      
      const handleDeleteSession = (sessionId) => {
        setScheduledSessions(scheduledSessions.filter(session => session.id !== sessionId));
      };
      
      const handleCompleteSession = (session) => {
        // Remove from scheduled
        setScheduledSessions(scheduledSessions.filter(s => s.id !== session.id));
        
        // Add to completed
        const completedSession = {...session, completedAt: new Date().toISOString()};
        setCompletedSessions([...completedSessions, completedSession]);
      };
      
      // Sort scheduled sessions by date
      const sortedSessions = [...scheduledSessions].sort((a, b) => 
        new Date(a.date) - new Date(b.date)
      );
      
      // Get upcoming sessions (future dates)
      const now = new Date();
      const upcomingSessions = sortedSessions.filter(session => 
        new Date(session.date) > now
      );
      
      // Get today's sessions
      const todaySessions = sortedSessions.filter(session => {
        const sessionDate = new Date(session.date);
        return sessionDate.toDateString() === now.toDateString();
      });
      
      return (
        <div className="container mx-auto px-4 pb-12 max-w-6xl">
          <Header darkMode={darkMode} toggleDarkMode={toggleDarkMode} />
          
          <main className="mt-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div className="lg:col-span-2">
              {selectedMeditation && (
                <div className="mb-8 fade-in">
                  <h2 className="text-xl font-bold mb-4 flex items-center">
                    <i data-lucide={selectedMeditation.icon} className="w-6 h-6 mr-2 text-purple-500"></i>
                    {selectedMeditation.title}
                  </h2>
                  
                  <YouTubePlayer videoId={selectedMeditation.videoId} />
                  
                  <div className="flex flex-wrap gap-3 mb-6">
                    <div className="flex items-center bg-purple-100 dark:bg-purple-900 text-purple-800 dark:text-purple-200 px-3 py-1 rounded-full text-sm">
                      <i data-lucide="clock" className="w-4 h-4 mr-1"></i>
                      {formatTime(selectedMeditation.duration)}
                    </div>
                    <div className="flex items-center bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200 px-3 py-1 rounded-full text-sm">
                      <i data-lucide="tag" className="w-4 h-4 mr-1"></i>
                      {selectedMeditation.category}
                    </div>
                  </div>
                  
                  <p className="mb-6">{selectedMeditation.description}</p>
                  
                  <div className="flex gap-3">
                    <button 
                      className="btn-primary text-white py-2 px-4 rounded-md flex items-center"
                      onClick={() => {
                        const session = {
                          id: Date.now(),
                          meditation: selectedMeditation,
                          date: new Date().toISOString()
                        };
                        handleCompleteSession(session);
                      }}
                    >
                      <i data-lucide="check-circle" className="w-5 h-5 mr-2"></i>
                      Complete
                    </button>
                    <button 
                      className="btn-secondary text-white py-2 px-4 rounded-md flex items-center"
                      onClick={() => setSelectedMeditation(null)}
                    >
                      <i data-lucide="arrow-left" className="w-5 h-5 mr-2"></i>
                      Back
                    </button>
                  </div>
                </div>
              )}
              
              {!selectedMeditation && (
                <>
                  <h2 className="text-xl font-bold mb-4 flex items-center">
                    <i data-lucide="list" className="w-6 h-6 mr-2 text-purple-500"></i>
                    Meditation Library
                  </h2>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                    {meditations.map(meditation => (
                      <MeditationCard 
                        key={meditation.id}
                        meditation={meditation}
                        onSelect={setSelectedMeditation}
                        isActive={selectedMeditation?.id === meditation.id}
                      />
                    ))}
                  </div>
                  
                  {todaySessions.length > 0 && (
                    <div className="mb-8">
                      <h2 className="text-xl font-bold mb-4 flex items-center">
                        <i data-lucide="calendar" className="w-6 h-6 mr-2 text-purple-500"></i>
                        Today's Sessions
                      </h2>
                      
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {todaySessions.map(session => (
                          <div key={session.id} className="card rounded-lg p-4 pulse">
                            <div className="flex justify-between items-start mb-3">
                              <h3 className="font-semibold">{session.meditation.title}</h3>
                              <span className="text-sm bg-purple-100 dark:bg-purple-900 text-purple-800 dark:text-purple-200 px-2 py-0.5 rounded-full">
                                {new Date(session.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                              </span>
                            </div>
                            <p className="text-sm opacity-75 mb-3">{session.meditation.description}</p>
                            <div className="flex gap-2">
                              <button 
                                className="btn-primary text-white py-1 px-3 rounded-md text-sm flex items-center"
                                onClick={() => setSelectedMeditation(session.meditation)}
                              >
                                <i data-lucide="play" className="w-4 h-4 mr-1"></i>
                                Start
                              </button>
                              <button 
                                className="btn-secondary text-white py-1 px-3 rounded-md text-sm flex items-center"
                                onClick={() => handleCompleteSession(session)}
                              >
                                <i data-lucide="check" className="w-4 h-4 mr-1"></i>
                                Complete
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  
                  <ProgressChart completedSessions={completedSessions} />
                </>
              )}
            </div>
            
            <div>
              <ScheduleForm 
                meditations={meditations}
                onSchedule={handleScheduleSession}
              />
              
              <div className="card rounded-lg p-4 mb-6">
                <h3 className="font-semibold mb-4 flex items-center">
                  <i data-lucide="calendar" className="w-5 h-5 mr-2 text-purple-500"></i>
                  Upcoming Sessions
                </h3>
                
                {upcomingSessions.length === 0 ? (
                  <p className="text-sm opacity-75 text-center py-4">
                    No upcoming sessions scheduled
                  </p>
                ) : (
                  upcomingSessions.map(session => (
                    <ScheduleItem 
                      key={session.id}
                      session={session}
                      onDelete={handleDeleteSession}
                    />
                  ))
                )}
              </div>
              
              <div className="card rounded-lg p-4">
                <h3 className="font-semibold mb-4 flex items-center">
                  <i data-lucide="award" className="w-5 h-5 mr-2 text-purple-500"></i>
                  Stats
                </h3>
                
                <div className="grid grid-cols-2 gap-4">
                  <div className="text-center p-3 bg-purple-50 dark:bg-purple-900/30 rounded-lg">
                    <div className="text-2xl font-bold text-purple-600 dark:text-purple-400">
                      {completedSessions.length}
                    </div>
                    <div className="text-sm">Sessions Completed</div>
                  </div>
                  
                  <div className="text-center p-3 bg-green-50 dark:bg-green-900/30 rounded-lg">
                    <div className="text-2xl font-bold text-green-600 dark:text-green-400">
                      {formatTime(completedSessions.reduce((total, session) => 
                        total + session.meditation.duration, 0
                      ))}
                    </div>
                    <div className="text-sm">Total Time</div>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    };
    
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
